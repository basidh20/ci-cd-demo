# =============================================================================
# LESSON 11 — A real deployment: GitHub Pages and environments
# =============================================================================
# Read COURSE/11-deployment.md alongside this file.
#
# This one actually publishes something to the public internet, which makes
# it the most satisfying lesson in the course.
#
# BEFORE IT WILL WORK, do this once:
#   Repo -> Settings -> Pages -> "Build and deployment"
#        -> Source: **GitHub Actions**   (not "Deploy from a branch")
#
# Your site then lives at:
#   https://<your-username>.github.io/<your-repo-name>/
# =============================================================================

name: 11 - Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# The three permissions the Pages deployment API requires.
permissions:
  contents: read      # to check out the code
  pages: write        # to publish
  id-token: write     # OIDC: proves to Pages that this run is genuinely yours

# DEPLOYMENT CONCURRENCY. Note the difference from Lesson 08:
# `cancel-in-progress: FALSE`. For a deploy you want runs to QUEUE.
# Cancelling a half-finished deployment is how you get a broken site.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    steps:
      # Local actions are read from the checkout, so checkout comes first.
      - uses: actions/checkout@v4

      - name: Set up the project
        uses: ./.github/actions/setup-project
        with:
          node-version: '22'

      - name: Test before shipping
        run: npm test

      - name: Build
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # A Pages-specific artifact: a tarball in the exact shape the Pages
      # service expects. Not interchangeable with upload-artifact.
      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build

    # ENVIRONMENTS. More than a label — an environment can carry:
    #   - required reviewers (a human must approve before this job starts)
    #   - a wait timer
    #   - branch restrictions (only main may deploy here)
    #   - its own secrets, which override repository secrets
    #
    # `github-pages` is a special built-in environment. Create your own
    # under Settings -> Environments; protection rules are where the real
    # value is, and they are free on public repos.
    environment:
      name: github-pages
      # Publishing the URL makes it a clickable link in the Actions UI and
      # on the repo's Environments page.
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Announce
        run: |
          {
            echo "## Deployed"
            echo ""
            echo "Your site is live at ${{ steps.deployment.outputs.page_url }}"
            echo ""
            echo "That page was generated by \`src/build.js\` on a machine that"
            echo "did not exist five minutes ago and no longer exists now."
          } >> "$GITHUB_STEP_SUMMARY"
